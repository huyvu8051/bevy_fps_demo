<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: lets the page draw under the iPhone notch/home-
     indicator area (so #game-container's own padding — via
     env(safe-area-inset-*) above — is what actually keeps content clear
     of them, rather than Safari just letterboxing the page short of that
     area and never handing us the extra width/height at all). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>bevy_fps_demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; }

  /* Padded container the canvas actually lives in — WindowPlugin's
     `canvas: Some("#bevy-canvas")` + `fit_canvas_to_parent: true`
     (crates/client/src/lib.rs) makes winit continuously resize
     #bevy-canvas to match THIS element's size, so the padding here is
     real screen space the canvas never draws into, not just a CSS border
     sitting on top of it. `env(safe-area-inset-*)` covers the iPhone
     notch/Dynamic Island/home-indicator safe areas on top of a flat
     minimum padding — without it the touch controls (bottom corners)
     would sit right under the home-indicator gesture zone. */
  #game-container {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
  }
  /* touch-action: none — without this, iOS Safari/mobile Chrome treat a
     vertical finger drag on the canvas as a page-pan/rubber-band gesture
     candidate and can swallow or truncate the touchmove sequence before
     winit's own `event.prevent_default()` (crates/client/src/touch_input.rs'
     drag-to-scroll on the settings/cheat panel, touch_scroll_settings_menu)
     ever sees a clean stream of moves — the browser, not our code, ends up
     owning the gesture. `overscroll-behavior: none` is the same idea for
     the bounce-scroll iOS applies at the document edges. Desktop/mouse
     input is unaffected either way. */
  #bevy-canvas { display: block; width: 100%; height: 100%; touch-action: none; overscroll-behavior: none; }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #111;
    color: #eee;
    font: 14px monospace;
    z-index: 10;
  }
  #loading.hidden { display: none; }
  #loading-bar-track {
    width: min(320px, 80vw);
    height: 10px;
    border: 1px solid #555;
    border-radius: 5px;
    overflow: hidden;
    background: #222;
  }
  #loading-bar-fill {
    height: 100%;
    width: 0%;
    background: #4a7dff;
    transition: width 0.15s ease-out;
  }
  #loading-label { opacity: 0.85; }
  #loading-error { color: #ff6b6b; max-width: 80vw; text-align: center; }

  /* Resource HUD — see startResourceStats' own comment for what each
     number actually means/where it comes from and its limits. Offset
     below the HP text (top-left, see setup() in crates/client/src/lib.rs)
     so the two don't overlap. */
  #resource-stats {
    position: fixed;
    top: max(40px, calc(env(safe-area-inset-top) + 40px));
    left: max(12px, env(safe-area-inset-left));
    z-index: 20;
    font: 11px monospace;
    line-height: 1.4;
    color: #9f9;
    background: rgba(0, 0, 0, 0.55);
    padding: 4px 7px;
    border-radius: 4px;
    white-space: pre;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game-container"><canvas id="bevy-canvas"></canvas></div>

<div id="loading">
  <div id="loading-label">Loading… 0%</div>
  <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
  <div id="loading-error"></div>
</div>

<script type="module">
  // Cache-busting: web.js/web_bg.wasm keep the exact same filename across
  // every rebuild (no content hash in the name), and mobile Safari in
  // particular caches a fetched module/wasm very aggressively with no easy
  // user-facing "hard refresh" gesture — a phone could keep re-running a
  // build from hours/days ago indefinitely, silently, with no way to tell
  // from the game itself that it's stale. Appending a per-page-load
  // timestamp to both URLs forces a real network fetch every time (this is
  // a small dev/test deployment, not a high-traffic static site, so paying
  // for zero HTTP caching here is the right trade against ever silently
  // testing stale code again). `cache: "no-store"` on top of that as a
  // second layer against any intermediate proxy/service-worker cache that
  // might still try to reuse a same-URL response.
  const CACHE_BUST = Date.now();
  const { default: init } = await import(`./web.js?v=${CACHE_BUST}`);

  const label = document.getElementById("loading-label");
  const fill = document.getElementById("loading-bar-fill");
  const overlay = document.getElementById("loading");
  const errorBox = document.getElementById("loading-error");

  // wasm-bindgen's init() accepts a Response/promise-of-Response and will
  // stream+instantiate it directly (WebAssembly.instantiateStreaming) with
  // no way to observe progress in between — fine for UX, useless for a
  // progress bar. Fetching by hand instead, reading the body in chunks via
  // a ReadableStream reader, tracking bytes-read against Content-Length
  // (the .wasm is served uncompressed as a plain static file here, so the
  // header is present and accurate — would need a different progress
  // signal if this were ever served gzip/brotli-compressed with chunked
  // transfer-encoding, where Content-Length reflects the compressed size
  // or may be absent entirely).
  async function fetchWithProgress(url) {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`fetch ${url} failed: ${response.status} ${response.statusText}`);
    }
    const total = Number(response.headers.get("Content-Length")) || 0;
    if (!response.body || total === 0) {
      // No streaming body or no length to report against — fall back to a
      // plain await with no progress, better than crashing.
      label.textContent = "Loading…";
      return await response.arrayBuffer();
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      const pct = Math.min(100, Math.round((received / total) * 100));
      fill.style.width = `${pct}%`;
      label.textContent = `Loading… ${pct}% (${(received / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB)`;
    }

    const bytes = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
      bytes.set(chunk, offset);
      offset += chunk.length;
    }
    return bytes.buffer;
  }

  // On-screen RAM/CPU/GPU readout — added to chase down "won't open on
  // iPhone, probably too much RAM" without needing Safari's remote Web
  // Inspector (requires a Mac + cable + enabling it in iOS Settings first,
  // not something to ask of every test run). Everything here is a REAL
  // browser-exposed number, not a guess:
  //  - WASM memory: the game's actual linear-memory footprint
  //    (wasm-bindgen's `init()` return value exposes the WebAssembly.
  //    Memory instance directly — see target/web_dist/web.js's
  //    `__wbg_finalize_init`/`wasm.memory` — no Rust-side plumbing
  //    needed). This is the one number that actually answers "how much
  //    RAM is this tab using", and works on every browser.
  //  - JS heap (performance.memory): Chrome/Android-only, non-standard —
  //    iOS Safari has no equivalent API at all, shows "n/a" there.
  //  - navigator.deviceMemory: an approximate, ROUNDED-DOWN total device
  //    RAM in GB — also Chrome/Android-only; iOS Safari never implemented
  //    it (fingerprinting concerns), shows "n/a" there too.
  //  - GPU name: WEBGL_debug_renderer_info gives the renderer STRING (e.g.
  //    "Apple GPU"), not a usage percentage — no browser exposes real-time
  //    GPU utilization to a web page, on any platform, full stop.
  //  - CPU: same story — no browser exposes per-process CPU%. hardware
  //    Concurrency (core count) is the only real CPU number available. FPS
  //    is the closest indirect proxy for "is the CPU/GPU struggling".
  function startResourceStats(wasmModule) {
    const el = document.createElement("div");
    el.id = "resource-stats";
    document.body.appendChild(el);

    let rendererInfo = "n/a";
    try {
      const canvas = document.getElementById("bevy-canvas");
      const gl = canvas && (canvas.getContext("webgl2") || canvas.getContext("webgl"));
      const dbg = gl && gl.getExtension("WEBGL_debug_renderer_info");
      if (gl && dbg) rendererInfo = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    } catch (err) {
      rendererInfo = `error: ${err}`;
    }

    let frames = 0;
    let lastTick = performance.now();
    let fps = 0;
    function countFrame() {
      frames++;
      requestAnimationFrame(countFrame);
    }
    requestAnimationFrame(countFrame);

    setInterval(() => {
      const now = performance.now();
      fps = Math.round((frames * 1000) / (now - lastTick));
      frames = 0;
      lastTick = now;

      const wasmMB = (wasmModule.memory.buffer.byteLength / 1e6).toFixed(1);
      const jsHeap = performance.memory
        ? `${(performance.memory.usedJSHeapSize / 1e6).toFixed(1)}/${(performance.memory.jsHeapSizeLimit / 1e6).toFixed(0)} MB`
        : "n/a (Safari)";
      const deviceMem = navigator.deviceMemory ? `${navigator.deviceMemory} GB (approx)` : "n/a";
      const cores = navigator.hardwareConcurrency ?? "n/a";

      const text =
        `WASM mem: ${wasmMB} MB\n` +
        `JS heap:  ${jsHeap}\n` +
        `Device:   ${deviceMem}, ${cores} cores\n` +
        `GPU:      ${rendererInfo}\n` +
        `FPS:      ${fps}`;
      el.textContent = text;
      console.log(`[stats] wasm=${wasmMB}MB heap=${jsHeap} device=${deviceMem} cores=${cores} gpu="${rendererInfo}" fps=${fps}`);
    }, 1000);
  }

  try {
    const wasmBytes = await fetchWithProgress(`./web_bg.wasm?v=${CACHE_BUST}`);
    label.textContent = "Starting…";
    const wasmModule = await init({ module_or_path: wasmBytes });
    // Bevy's own winit canvas takes over the page at this point; the
    // overlay's only job was covering the wasm download, so it's done.
    overlay.classList.add("hidden");
    startResourceStats(wasmModule);
  } catch (err) {
    label.textContent = "Failed to load.";
    errorBox.textContent = String(err);
    console.error(err);
  }
</script>
</body>
</html>
