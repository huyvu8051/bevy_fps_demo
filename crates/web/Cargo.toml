[package]
name = "web"
version = "0.1.0"
edition = "2024"

# cdylib is the whole point of this crate's existence — client's own
# crate-type is deliberately staticlib+rlib only (see its Cargo.toml
# comment: mixing in cdylib there once broke the iOS device build with a
# dyld crash). wasm-bindgen needs a cdylib compiled to
# wasm32-unknown-unknown to produce a runnable .wasm module, so that lives
# here instead, in a crate the iOS build never touches.
[lib]
crate-type = ["cdylib"]

[dependencies]
client = { path = "../client" }

# Pinned exact (not "0.2.126", which would let cargo resolve down to
# whatever's already in the graph via other deps, e.g. 0.2.106 pulled in
# transitively) — the wasm-bindgen CLI installed on this machine is
# 0.2.126, and the CLI version MUST exactly match the wasm-bindgen crate
# version linked into the .wasm it processes, or it refuses to run
# ("linked against a different version of wasm-bindgen"). Bump both
# together if the installed CLI is ever upgraded.
wasm-bindgen = "=0.2.126"
