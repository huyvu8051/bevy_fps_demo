[package]
name = "server"
default-run = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
avian3d = "0.7"
big-brain = { git = "https://github.com/huyvu8051/big-brain", rev = "c8e2cf2" }
# "png" / "jpeg": zombie.glb embeds PNG textures, the item-gallery car
# .glb files (also loaded here for their convex-hull colliders — see
# spawn_arena_car_colliders) embed JPEG ones. The server never
# renders either (no RenderPlugin at all here), but bevy_gltf's loader
# still tries to decode every embedded image while loading the scene, and
# aborts the whole load (skeleton / mesh included) if it hits a format
# with no decoder compiled in. Cheapest fix: just let it decode the
# pixels we'll ignore.
# "gltf_animation" (distinct from "bevy_animation"!) is what actually
# makes bevy_gltf's loader convert the file's animation curves into
# AnimationClip assets at all — without it, zombie.glb loaded with zero
# "AnimationN" labeled sub-assets even though bevy_animation itself was
# already enabled.
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_render", "bevy_gltf", "bevy_scene", "bevy_world_serialization", "bevy_animation", "gltf_animation", "png", "jpeg", "bevy_pbr", "debug", "reflect_auto_register"] }
bevy_rerecast = { version = "0.5", default-features = false, features = ["bevy_mesh"] }
rerecast = "0.4"
avian_rerecast = "0.6"
bevy_landmass = "0.12"
landmass_rerecast = "0.3"
bincode = { version = "2", features = ["serde"] }
bevy_replicon = "0.41"
bevy_replicon_renet2 = { version = "0.18", features = ["native_transport"] }
