[package]
name = "server"
default-run = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
avian3d = "0.7"
big-brain = { git = "https://github.com/huyvu8051/big-brain", rev = "c8e2cf2" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_render", "bevy_gltf", "bevy_scene", "bevy_world_serialization", "bevy_animation", "gltf_animation", "png", "jpeg", "bevy_pbr", "debug", "reflect_auto_register"] }
bevy_rerecast = { version = "0.5", default-features = false, features = ["bevy_mesh"] }
rerecast = "0.4"
avian_rerecast = "0.6"
bevy_landmass = "0.12"
landmass_rerecast = "0.3"
bincode = { version = "2", features = ["serde"] }
bevy_replicon = "0.41"
bevy_replicon_renet2 = { version = "0.18", features = ["native_transport"] }
