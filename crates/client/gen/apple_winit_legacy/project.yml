name: client
options:
  bundleIdPrefix: com.huyvu8051.bevyfpsdemo
  deploymentTarget:
    iOS: 13.0
    macOS: 11.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Bevy FPS Demo
      PRODUCT_BUNDLE_IDENTIFIER: com.huyvu8051.bevyfpsdemo
      DEVELOPMENT_TEAM: GNNA6PH896
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  client_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # cargo-apple drops the cross-compiled libclient.a under
        # Sources/<target-triple>/debug/ as a build BYPRODUCT (the real
        # linking happens via LIBRARY_SEARCH_PATHS + -lclient, from
        # target/ two levels up — see preBuildScripts' own comment). This
        # bare `path: Sources` scan was picking those .a files up as
        # ordinary resources and auto-bundling them into the .app (hence
        # the multi-GB libclient.a that ended up inside earlier builds),
        # and once both a simulator and a device build had each dropped
        # their own copy, Xcode saw two source files trying to produce the
        # same bundled "libclient.a" output and failed with "Multiple
        # commands produce". Excluding the whole triple-named directories
        # avoids both problems at once.
        excludes:
          - "aarch64-apple-ios/**"
          - "aarch64-apple-ios-sim/**"
          - "x86_64-apple-ios/**"
      - path: assets
        buildPhase: resources
        type: folder
      # Info.plist declares UILaunchStoryboardName: LaunchScreen, but this
      # scaffold never actually shipped a LaunchScreen.storyboard — iOS
      # falling back silently (no file = no crash) instead of erroring is
      # the likely reason the app's initial frame/geometry ended up wrong
      # on-device (reported as "only shows a corner" after rotating to
      # landscape). Without a real, orientation-flexible launch storyboard,
      # UIKit has no correct reference for the app's initial bounds before
      # winit's own view takes over. Referenced as an individual file
      # (not a folder resource — first attempt at this used `path:
      # client_iOS/Base.lproj` with `type: folder`, which made Xcode treat
      # the whole directory as an opaque resource blob and just copy the
      # raw .storyboard verbatim instead of routing it through the
      # Interface Builder storyboard compiler, so it never actually became
      # a loadable LaunchScreen.storyboardc). A plain per-file source
      # reference gets Xcode's normal per-extension build-phase assignment,
      # same as any other recognized file type.
      - path: client_iOS/Base.lproj/LaunchScreen.storyboard
    info:
      path: client_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # Landscape-only on both iPhone and iPad — an FPS's touch controls
        # (see crates/client's TouchControlsEnabled/spawn_touch_controls:
        # joystick bottom-left, fire bottom-right) are laid out assuming a
        # wide viewport, and the game's own camera/aspect-ratio handling was
        # never built to cope with a tall portrait frame. Previously both
        # orientations were allowed, so iOS could hand the app a portrait
        # window at launch (or mid-session on iPad, which rotates freely by
        # default) and the viewport stayed mismatched — the "viewport
        # không khớp" this was reported as.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad only: opts out of Split View/Slide Over multitasking, which
        # would otherwise hand the app an arbitrary (non-fullscreen, and
        # potentially portrait-shaped) window size regardless of the
        # orientation lock above.
        UIRequiresFullScreen: true
        # Required for >60Hz on iPhone (iPad doesn't need this) — without it,
        # iOS silently caps every app to 60Hz regardless of the display's
        # real ProMotion capability or anything the app itself requests, as
        # a battery-life default. This is the actual opt-in switch; the
        # WinitSettings reactive interval (see client's main()) only sets an
        # upper bound the app is willing to update at, it doesn't unlock the
        # display's own refresh rate ceiling by itself.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1.0.0
        
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS:  arm64
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(inherited) $(SRCROOT)/../../target/aarch64-apple-ios/$(CONFIGURATION)
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(inherited) $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(CONFIGURATION)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        # Xcode's "debug dylib" build acceleration (default YES since
        # Xcode 16-ish): links the main executable against a separate
        # Bevy\ FPS\ Demo.debug.dylib instead of embedding code directly, so
        # repeated Run-from-Xcode iteration only has to relink/swap that
        # small dylib instead of the whole app. Only Xcode's own Run/debug-
        # launch machinery knows how to substitute that dylib's real path on
        # a device — it's baked in at link time as an absolute path on THIS
        # Mac (.../gen/apple/../../target/...), which obviously doesn't
        # exist on the phone's filesystem. Works fine from Simulator (same
        # filesystem as the Mac) and from Xcode Run on a real device (the
        # debugger session patches it), but opening the app directly from
        # the Home Screen — bypassing Xcode entirely, which is the whole
        # point of a sideload build — dyld-fails with "Library not loaded".
        # Off, so the app is a normal self-contained binary that runs
        # standalone. The speed this setting buys only applies to the
        # native relink step (a couple .mm files) — for this project the
        # actual bottleneck on every build is the Rust/cargo compile in
        # preBuildScripts below, which this setting does nothing for, so
        # turning it off costs effectively nothing here.
        ENABLE_DEBUG_DYLIB: false
      groups: [app]
    dependencies:
      - framework: libclient.a
        embed: false
      
      
      
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      
      - sdk: AudioToolbox.framework
    preBuildScripts:
      
      - script: |-
          PATH=${PATH}:${HOME:?}/.cargo/bin
          # cargo-apple's own internal check for the built .a (separate from
          # LIBRARY_SEARCH_PATHS above, which only controls Xcode's linker)
          # has a hardcoded relative path assuming target/ sits 2 levels
          # above gen/apple/ — true for a single-crate (non-workspace)
          # project, but this workspace's real shared target/ sits 4 levels
          # up (apple -> gen -> client -> crates -> workspace root). Scheme-
          # level environmentVariables (tried first) don't reach build-phase
          # scripts at all — those only apply to the launched app at Run
          # time — so this has to be exported right here instead, redirecting
          # cargo's output to the 2-levels-up location cargo-apple expects
          # (crates/client/target/, not shared with the normal desktop
          # `cargo build`, which still uses the real workspace target/).
          export CARGO_TARGET_DIR="${SRCROOT}/../../target"
          CARGO_APPLE=`which cargo-apple`
          # GCC_PREPROCESSOR_DEFINITIONS is only ever set for Debug (Xcode's
          # own default adds e.g. DEBUG=1 there) — Release/Profile builds
          # (Product > Profile, used for Instruments) legitimately have it
          # empty, which the old `:?` ("error if unset/null") made fail
          # outright with "parameter null or not set" the first time anyone
          # tried to profile. `:-` (default to empty string instead) is fine
          # here since cargo-apple just forwards this list of defines to the
          # Rust build — an empty list is a completely valid value, not a
          # missing one.
          ${CARGO_APPLE} xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?} ${FEATURES}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../../target/aarch64-apple-ios/${CONFIGURATION}/deps/libclient.a
          - $(SRCROOT)/../../target/x86_64-apple-ios/${CONFIGURATION}/deps/libclient.a