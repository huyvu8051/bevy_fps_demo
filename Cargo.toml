[workspace]
resolver = "2"
members = ["crates/client", "crates/shared", "crates/server"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev-fast]
inherits = "dev"
debug = "line-tables-only"
strip = "debuginfo"

[patch.crates-io]
rerecast = { git = "https://github.com/huyvu8051/rerecast-vendor.git", branch = "main" }
