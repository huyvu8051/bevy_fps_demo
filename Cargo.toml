[package]
name = "bevy_fps_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.6"
bevy = { version = "0.18", features = ["jpeg", "bevy_dev_tools"] }
big-brain = { path = "vendor/big-brain" }
vleue_navigator = { version = "0.15", default-features = false }

# Build faster during dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
