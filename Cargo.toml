[package]
name = "bevy_fps_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevior_tree = { version = "0.11.0", default-features = false }
bevy = { version = "0.19", features = ["jpeg", "bevy_dev_tools"] }

# Build faster during dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
